[project]
name = "mochi-daemon"
version = "0.1.0"
description = "Mochi Hub backend daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sse-starlette>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mochi-daemon = "mochi_daemon.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mochi_daemon"]

